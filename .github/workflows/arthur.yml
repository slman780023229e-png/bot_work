name: ARTHUR BOT Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install

      - name: Clean Stale Session Keys Older Than 4 Hours
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          node -e '
            const url = process.env.UPSTASH_REDIS_REST_URL;
            const token = process.env.UPSTASH_REDIS_REST_TOKEN;
            const FOUR_HOURS_MS = 4 * 60 * 60 * 1000;
            const now = Date.now();

            async function redis(cmd) {
              const res = await fetch(url, {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json"
                },
                body: JSON.stringify(cmd)
              });
              return res.json();
            }

            (async () => {
              if (!url || !token) {
                console.log("Upstash credentials not set; skipping Redis cleanup.");
                return;
              }

              try {
                // 1) إذا كان لديك فهرس زمني في Upstash مثل session_timestamps (hash: key -> timestamp_ms)
                const tsMapRes = await redis(["HGETALL", "arthur_session_ts"]);
                const tsList = Array.isArray(tsMapRes.result) ? tsMapRes.result : [];
                const expiredKeys = [];

                for (let i = 0; i < tsList.length; i += 2) {
                  const key = tsList[i];
                  const ts = Number(tsList[i + 1] || 0);
                  if (
                    key &&
                    !key.includes("creds") &&
                    !key.startsWith("session-") &&
                    ts > 0 &&
                    (now - ts) >= FOUR_HOURS_MS
                  ) {
                    expiredKeys.push(key);
                  }
                }

                // 2) احتياطي: فحص المفاتيح المتكررة المعروفة إذا لم يكن هناك طابع زمني محفوظ
                if (expiredKeys.length === 0) {
                  const keysRes = await redis(["KEYS", "*"]);
                  const allKeys = Array.isArray(keysRes.result) ? keysRes.result : [];
                  for (const k of allKeys) {
                    if (
                      (k.includes("pre-key") || k.includes("sender-key-memory")) &&
                      !k.includes("creds") &&
                      !k.startsWith("session-")
                    ) {
                      expiredKeys.push(k);
                    }
                  }
                }

                if (expiredKeys.length > 0) {
                  for (let i = 0; i < expiredKeys.length; i += 100) {
                    const batch = expiredKeys.slice(i, i + 100);
                    await redis(["DEL", ...batch]);
                    await redis(["HDEL", "arthur_session_ts", ...batch]);
                  }
                  console.log(`Cleaned ${expiredKeys.length} stale session keys (>= 4h).`);
                } else {
                  console.log("No stale session keys (>= 4h) found.");
                }
              } catch (err) {
                console.log("Redis cleanup skipped:", err.message);
              }
            })();
          '

      - name: Run Bot with Automatic Repository Saving
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH_NAME="${GITHUB_REF_NAME:-${GITHUB_REF#refs/heads/}}"
          BRANCH_NAME="${BRANCH_NAME:-main}"

          if [ -n "$GITHUB_TOKEN" ] && [ -n "$GITHUB_REPOSITORY" ]; then
            git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

          # حماية: ضمان وجود قواعد الاستبعاد دون مسح ما هو موجود
          touch .gitignore
          for rule in "node_modules/" "**/node_modules/" ".env" ".env.*" "ملف_الاتصال/" "**/ملف_الاتصال/" "**/auth_info_baileys/" "**/creds.json" "**/*.log"; do
            grep -qxF "$rule" .gitignore || echo "$rule" >> .gitignore
          done

          save_changes() {
            echo "Checking repository changes..."

            # تنظيف الملفات المؤقتة الأقدم من 4 ساعات داخل مجلد الاتصال إن وُجدت دون مسح creds أو الجلسة الأساسية
            if [ -d "ملف_الاتصال" ]; then
              find "ملف_الاتصال" -type f -mmin +240 ! -name "creds.json" ! -name "session-*" -delete 2>/dev/null || true
            fi

            # إزالة الملفات الحساسة من تتبع Git فقط (دون حذفها من بيئة التشغيل)
            git rm -r --cached --ignore-unmatch node_modules yuno_bot/node_modules "ملف_الاتصال" auth_info_baileys 2>/dev/null || true
            git rm --cached --ignore-unmatch .env .env.* "**/creds.json" "**/*.pem" "**/*.key" 2>/dev/null || true

            # إضافة كافة المجلدات والملفات الجديدة/المعدلة مع استبعاد الحساس والمؤقت
            git add --ignore-errors --all -- . \
              ':(exclude)ملف_الاتصال/**' \
              ':(exclude)**/ملف_الاتصال/**' \
              ':(exclude).env' \
              ':(exclude).env.*' \
              ':(exclude)**/.env' \
              ':(exclude)**/.env.*' \
              ':(exclude)**/node_modules/**' \
              ':(exclude)**/auth_info_baileys/**' \
              ':(exclude)**/creds.json' \
              ':(exclude)**/*.pem' \
              ':(exclude)**/*.key' \
              ':(exclude)**/*.p12' \
              ':(exclude)**/*.pfx' \
              ':(exclude)**/*.log'

            if git diff --cached --quiet; then
              echo "No new changes to commit."
              return 0
            fi

            echo "Staged changes summary:"
            git diff --cached --name-status

            git commit -m "Auto-save ARTHUR repository progress" || {
              echo "Git commit failed."
              return 1
            }

            git fetch origin "+refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}" || {
              echo "Git fetch failed for branch ${BRANCH_NAME}."
              return 1
            }

            if [ "$(git rev-list --count "origin/${BRANCH_NAME}..HEAD")" -gt 0 ]; then
              if ! git push origin "HEAD:${BRANCH_NAME}"; then
                echo "Push failed; attempting rebase with remote branch..."
                git -c rebase.autoStash=true rebase "origin/${BRANCH_NAME}" || {
                  git rebase --abort || true
                  echo "Rebase conflict detected; changes remain safe in runner."
                  return 1
                }
                git push origin "HEAD:${BRANCH_NAME}" || {
                  echo "Git push failed after rebase."
                  return 1
                }
              fi
              echo "Repository changes pushed successfully to ${BRANCH_NAME}."
            else
              echo "No new commits to push."
            fi
          }

          cleanup_and_exit() {
            echo "Shutting down runner. Attempting final save..."
            save_changes || echo "Final save failed."
            exit "${1:-0}"
          }

          trap 'cleanup_and_exit 0' SIGTERM SIGINT

          echo "ARTHUR BOT supervisor started. Auto-save interval: 5 minutes."

          while true; do
            node start.js &
            BOT_PID=$!
            echo "ARTHUR BOT started (PID: $BOT_PID)."
            LAST_SAVE=$(date +%s)
            while kill -0 "$BOT_PID" 2>/dev/null; do
              sleep 5
              NOW=$(date +%s)
              if [ $((NOW - LAST_SAVE)) -ge 300 ]; then
                if kill -0 "$BOT_PID" 2>/dev/null; then
                  save_changes || echo "Auto-save failed; will retry later."
                fi
                LAST_SAVE=$(date +%s)
              fi
            done
            wait "$BOT_PID"
            BOT_STATUS=$?
            echo "Bot exited with status $BOT_STATUS. Saving progress and restarting immediately..."
            save_changes || echo "Save after exit failed."
            sleep 2
          done
