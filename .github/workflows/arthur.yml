name: ARTHUR BOT Runner

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:
      - name: سحب ملفات البوت من المستودع
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: تجهيز بيئة Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: تثبيت المكتبات
        run: npm install

      - name: استرجاع ملف الاتصال من المخزن المخفي (Cache)
        id: restore-session-cache
        uses: actions/cache@v4
        with:
          path: |
            ملف_الاتصال
            ArthurSession
            ArthurSubBot
            BackupSession
            session
            sessions
            auth_info_baileys
          key: arthur-session-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-v1-${{ github.ref_name }}-
            arthur-session-v1-

      - name: التحقق من استرجاع ملف الاتصال
        shell: bash
        run: |
          if [ -d "ملف_الاتصال" ] && [ -n "$(ls -A "ملف_الاتصال" 2>/dev/null)" ]; then
            echo "✅ تم استرجاع ملف الاتصال من المخزن المخفي بنجاح."
          else
            echo "ℹ️ لا يوجد ملف اتصال محفوظ مسبقاً، سيتم إنشاؤه وحفظه بعد الربط."
          fi

      - name: تشغيل البوت ورفع التعديلات إلى المستودع
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH_MAIN="${GITHUB_REF_NAME:-main}"

          # حماية المستودع من رفع ملفات الجلسات أو البيانات الحساسة
          touch .gitignore
          sed -i '/^database\/\?$/d' .gitignore 2>/dev/null || true

          add_ignore() {
            grep -qxF "$1" .gitignore || echo "$1" >> .gitignore
          }

          add_ignore "node_modules/"
          add_ignore "**/node_modules/"
          add_ignore ".env"
          add_ignore ".env.*"
          add_ignore "!/.env.example"
          add_ignore "ArthurSession/"
          add_ignore "ArthurSubBot/"
          add_ignore "BackupSession/"
          add_ignore "session/"
          add_ignore "sessions/"
          add_ignore "ملف_الاتصال/"
          add_ignore "auth_info_baileys/"
          add_ignore "**/creds.json"
          add_ignore "*.db"
          add_ignore "*.db.*"
          add_ignore "*.pem"
          add_ignore "*.key"
          add_ignore "*.p12"
          add_ignore "*.pfx"
          add_ignore "*.log"
          add_ignore "**/temp/"
          add_ignore "**/*.tmp"

          clean_session_temp() {
            if [ -d "ملف_الاتصال" ]; then
              TOTAL_FILES=$(find "ملف_الاتصال" -maxdepth 1 -type f 2>/dev/null | wc -l)
              if [ "$TOTAL_FILES" -gt 150 ]; then
                find "ملف_الاتصال" -maxdepth 1 -type f ! -name "creds.json" ! -name "session-*" -printf "%T@ %p\n" 2>/dev/null \
                  | sort -n \
                  | head -n $((TOTAL_FILES - 150)) \
                  | cut -d' ' -f2- \
                  | xargs -r rm -f 2>/dev/null || true
              fi
            fi
          }

          save_changes() {
            echo "🔍 جاري فحص التعديلات الجديدة لرفعها إلى المستودع..."
            clean_session_temp

            git rm -r --cached --ignore-unmatch -- \
              node_modules \
              ArthurSession \
              ArthurSubBot \
              BackupSession \
              session \
              sessions \
              "ملف_الاتصال" \
              auth_info_baileys 2>/dev/null || true

            git add -A 2>/dev/null || true
            git reset -q -- \
              node_modules \
              "**/node_modules/**" \
              .env \
              ".env.*" \
              "ArthurSession/**" \
              "ArthurSubBot/**" \
              "BackupSession/**" \
              "session/**" \
              "sessions/**" \
              "ملف_الاتصال/**" \
              "auth_info_baileys/**" \
              "**/creds.json" \
              "*.db" \
              "*.db.*" \
              "*.pem" \
              "*.key" \
              "*.p12" \
              "*.pfx" \
              "*.log" \
              "**/temp/**" \
              "**/*.tmp" 2>/dev/null || true

            git add .gitignore 2>/dev/null || true

            if git diff --cached --quiet; then
              echo "ℹ️ لا توجد تعديلات جديدة لرفعها."
              return 0
            fi

            git commit -m "حفظ تلقائي لتعديلات ARTHUR BOT" -q || {
              echo "❌ خطأ: فشل إنشاء نقطة الحفظ (Commit)."
              return 1
            }

            git fetch origin "+refs/heads/${BRANCH_MAIN}:refs/remotes/origin/${BRANCH_MAIN}" -q || {
              echo "❌ خطأ: فشل الاتصال بالمستودع لجلب آخر التحديثات."
              return 1
            }

            if [ "$(git rev-list --count "origin/${BRANCH_MAIN}..HEAD")" -gt 0 ]; then
              if ! git push origin "HEAD:${BRANCH_MAIN}" -q 2>/dev/null; then
                echo "⚠️ تعذر الرفع المباشر، جاري محاولة المزامنة والدمج التلقائي..."

                git fetch origin "+refs/heads/${BRANCH_MAIN}:refs/remotes/origin/${BRANCH_MAIN}" -q || return 1

                git -c rebase.autostash=true rebase "origin/${BRANCH_MAIN}" -q || {
                  git rebase --abort 2>/dev/null || true
                  echo "❌ خطأ: يوجد تعارض في الملفات (Rebase Conflict)، تعذر رفع التعديلات."
                  return 1
                }

                git push origin "HEAD:${BRANCH_MAIN}" -q || {
                  echo "❌ خطأ: فشل الرفع للمستودع بعد المزامنة. تأكد من صلاحيات الكتابة للمستودع."
                  return 1
                }
              fi
              echo "✅ تم رفع وحفظ جميع تعديلات البوت إلى المستودع بنجاح!"
            fi
          }

          cleanup_and_exit() {
            echo "🛑 جاري إيقاف البوت وحفظ التعديلات قبل الإغلاق..."
            if [ -n "${BOT_PID:-}" ]; then
              kill -TERM "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
            fi
            save_changes || echo "⚠️ حدث خطأ أثناء الحفظ النهائي."
            exit "${1:-0}"
          }

          trap 'cleanup_and_exit 0' SIGTERM SIGINT

          echo "========================================="
          echo "      تم بدء تشغيل ARTHUR BOT بنجاح      "
          echo "========================================="

          while true; do
            node start.js &
            BOT_PID=$!

            echo "🚀 البوت يعمل الآن (رقم العملية: $BOT_PID)"
            LAST_SAVE=$(date +%s)

            while kill -0 "$BOT_PID" 2>/dev/null; do
              sleep 5
              NOW=$(date +%s)

              if [ $((NOW - LAST_SAVE)) -ge 300 ]; then
                if kill -0 "$BOT_PID" 2>/dev/null; then
                  save_changes || echo "⚠️ فشلت محاولة الحفظ الدوري، ستتم إعادة المحاولة بعد 5 دقائق."
                fi
                LAST_SAVE=$(date +%s)
              fi
            done

            wait "$BOT_PID"
            BOT_STATUS=$?
            BOT_PID=""

            echo "⚠️ توقف البوت عن العمل (رمز الخروج: $BOT_STATUS)."
            save_changes || echo "⚠️ فشل الحفظ بعد توقف البوت."

            echo "🔄 إعادة تشغيل البوت تلقائياً خلال 5 ثوانٍ..."
            sleep 5
          done

      - name: حفظ ملف الاتصال في المخزن المخفي عند الإغلاق
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ملف_الاتصال
            ArthurSession
            ArthurSubBot
            BackupSession
            session
            sessions
            auth_info_baileys
          key: arthur-session-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
