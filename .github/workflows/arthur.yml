name: ARTHUR BOT Runner

on:
  workflow_dispatch:
  schedule:
    # تشغيل دوري كل خمس ساعات لتجنب تداخل التشغيلات الطويلة
    - cron: '0 */5 * * *'

permissions:
  contents: read

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    # أقل من فترة الجدولة، حتى لا تتراكم عمليات التشغيل
    timeout-minutes: 280
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_SESSION_ID: arthur-session

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify MongoDB configuration
        shell: bash
        run: |
          if [ -z "${MONGO_URI:-}" ]; then
            echo "ERROR: GitHub Secret MONGO_URI is missing. Refusing to start with local-only session storage."
            exit 1
          fi
          echo "MongoDB secret is present. Its value will not be printed."

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Start ARTHUR BOT with MongoDB session persistence
        run: node start.js
