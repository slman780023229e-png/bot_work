
name: ARTHUR BOT - تشغيل وحماية الجلسة

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:

      # ==========================================
      # 1. سحب ملفات المشروع
      # ==========================================
      - name: سحب ملفات ARTHUR BOT
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      # ==========================================
      # 2. استعادة جلسة واتساب
      # ==========================================
      - name: استعادة جلسة واتساب السابقة
        id: restore-session
        uses: actions/cache/restore@v4
        with:
          path: |
            ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-${{ github.ref_name }}-
            arthur-session-

      # ==========================================
      # 3. تجهيز Node.js 24
      # ==========================================
      - name: تجهيز بيئة Node.js الإصدار 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # ==========================================
      # 4. تثبيت المكتبات
      # ==========================================
      - name: تثبيت مكتبات المشروع
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci || {
              echo "❌ فشل تثبيت المكتبات باستخدام npm ci"
              exit 1
            }
          else
            npm install || {
              echo "❌ فشل تثبيت المكتبات باستخدام npm install"
              exit 1
            }
          fi

          echo "✅ تم تثبيت المكتبات بنجاح"

      # ==========================================
      # 5. حماية ملفات الاتصال والمكتبات
      # ==========================================
      - name: حماية ملفات الاتصال والمكتبات من الرفع
        shell: bash
        run: |
          set -Eeuo pipefail

          touch .gitignore

          grep -qxF "ملف_الاتصال/" .gitignore || \
            echo "ملف_الاتصال/" >> .gitignore

          grep -qxF "node_modules/" .gitignore || \
            echo "node_modules/" >> .gitignore

          grep -qxF ".env" .gitignore || \
            echo ".env" >> .gitignore

          grep -qxF ".env.*" .gitignore || \
            echo ".env.*" >> .gitignore

          git rm -r --cached --ignore-unmatch -- \
            "ملف_الاتصال" \
            "node_modules" \
            >/dev/null 2>&1 || true

          echo "✅ تمت حماية مجلد الاتصال والمكتبات"

      # ==========================================
      # 6. تشغيل البوت والرفع التلقائي
      # ==========================================
      - name: تشغيل البوت وحفظ تعديلات المشروع تلقائياً
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ARTHUR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f .gitignore ]; then
            touch .gitignore
          fi

          grep -qxF "node_modules/" .gitignore || \
            echo "node_modules/" >> .gitignore

          grep -qxF "ملف_الاتصال/" .gitignore || \
            echo "ملف_الاتصال/" >> .gitignore

          grep -qxF ".env" .gitignore || \
            echo ".env" >> .gitignore

          grep -qxF ".env.*" .gitignore || \
            echo ".env.*" >> .gitignore

          # ========================================
          # حفظ ورفع تعديلات المشروع
          # ========================================
          save_changes() {

            echo "🔍 جاري فحص تعديلات المشروع..."

            git rm -r --cached --ignore-unmatch \
              node_modules \
              yuno_bot/node_modules \
              "ملف_الاتصال" \
              2>/dev/null || true

            git rm --cached --ignore-unmatch \
              .env .env.* \
              2>/dev/null || true

            git add -A -- . \
              ':(exclude).gitignore' \
              ':(exclude)ملف_الاتصال' \
              ':(exclude)ملف_الاتصال/**' \
              ':(exclude).env' \
              ':(exclude).env.*' \
              ':(exclude)**/.env' \
              ':(exclude)**/.env.*' \
              ':(exclude)**/node_modules' \
              ':(exclude)**/node_modules/**' \
              ':(exclude)**/creds.json' \
              ':(exclude)**/*.pem' \
              ':(exclude)**/*.key' \
              ':(exclude)**/*.p12' \
              ':(exclude)**/*.pfx' \
              ':(exclude)**/*.log' \
              ':(exclude)**/temp/**' || {
                echo "❌ فشل إضافة تعديلات المشروع"
                return 1
              }

            git add .gitignore || true

            if ! git diff --cached --quiet; then

              git commit \
                -m "Auto-save ARTHUR repository progress" || {
                  echo "❌ فشل إنشاء الحفظ المحلي"
                  return 1
                }

              echo "✅ تم إنشاء حفظ للتعديلات"

            else
              echo "ℹ️ لا توجد تعديلات جديدة للرفع"
              return 0
            fi

            git fetch origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || {
                echo "❌ فشل جلب آخر تحديثات GitHub"
                return 1
              }

            if [ "$(git rev-list --count \
              "origin/${GITHUB_REF_NAME}..HEAD")" -gt 0 ]; then

              if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then

                echo "⚠️ فشل الرفع الأول، جاري مزامنة التعديلات..."

                git fetch origin \
                  "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || {
                    echo "❌ فشل جلب التحديثات للمزامنة"
                    return 1
                  }

                git -c rebase.autoStash=true rebase \
                  "origin/${GITHUB_REF_NAME}" || {
                    git rebase --abort || true
                    echo "❌ حدث تعارض أثناء المزامنة"
                    return 1
                  }

                git push origin "HEAD:${GITHUB_REF_NAME}" || {
                  echo "❌ فشل رفع التعديلات بعد المزامنة"
                  return 1
                }
              fi

              echo "✅ تم رفع تعديلات المشروع إلى GitHub بنجاح"

            else
              echo "ℹ️ لا توجد تعديلات جديدة تحتاج إلى الرفع"
            fi
          }

          # ========================================
          # الإيقاف والحفظ النهائي
          # ========================================
          cleanup_and_exit() {

            echo "🛑 جاري إيقاف البوت وحفظ التعديلات..."

            save_changes || \
              echo "❌ فشل الحفظ النهائي"

            exit "${1:-0}"
          }

          trap 'cleanup_and_exit 0' SIGTERM SIGINT

          echo "======================================"
          echo "      ARTHUR BOT - NODE.JS 24"
          echo "======================================"

          echo "🚀 بدأ نظام تشغيل البوت والرفع التلقائي"

          save_changes || \
            echo "⚠️ فشل الرفع الأول، ستتم إعادة المحاولة"

          RESTART_DELAY=2

          # ========================================
          # تشغيل البوت وإعادة تشغيله
          # ========================================
          while true; do

            echo "🚀 جاري تشغيل ARTHUR BOT..."

            node start.js &
            BOT_PID=$!

            echo "✅ بدأ البوت. رقم العملية: $BOT_PID"

            LAST_SAVE=$(date +%s)

            while kill -0 "$BOT_PID" 2>/dev/null; do

              sleep 5

              NOW=$(date +%s)

              if [ $((NOW - LAST_SAVE)) -ge 300 ]; then

                if kill -0 "$BOT_PID" 2>/dev/null; then

                  echo "⏳ حان موعد الحفظ الدوري..."

                  save_changes || \
                    echo "❌ فشل الحفظ الدوري، ستتم إعادة المحاولة"

                fi

                LAST_SAVE=$(date +%s)
              fi

            done

            wait "$BOT_PID"
            BOT_STATUS=$?

            echo "⚠️ توقف البوت. رمز الخروج: $BOT_STATUS"

            save_changes || \
              echo "❌ فشل حفظ التعديلات بعد توقف البوت"

            echo "🔄 ستتم إعادة تشغيل البوت بعد ${RESTART_DELAY} ثانية..."

            sleep "$RESTART_DELAY"

            RESTART_DELAY=$((RESTART_DELAY + 2))

            if [ "$RESTART_DELAY" -gt 30 ]; then
              RESTART_DELAY=30
            fi

          done

      # ==========================================
      # 7. حفظ جلسة واتساب في Cache
      # ==========================================
      - name: حفظ جلسة واتساب في ذاكرة Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
