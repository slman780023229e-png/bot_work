
name: ARTHUR BOT Runner - Protected Session

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 235

    steps:

      # ==========================================
      # 1. DOWNLOAD PROJECT
      # ==========================================
      - name: سحب ملفات ARTHUR BOT
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      # ==========================================
      # 2. RESTORE OLD CACHE - MIGRATION
      # ==========================================
      - name: استرجاع الجلسة القديمة للترحيل الآمن
        id: restore-old-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ملف_الاتصال
            ArthurSession
            ArthurSubBot
            BackupSession
            session
            sessions
            auth_info_baileys
          key: arthur-session-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-v1-${{ github.ref_name }}-
            arthur-session-v1-

      # ==========================================
      # 3. NODE ENVIRONMENT
      # ==========================================
      - name: تجهيز Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: تثبيت المكتبات
        shell: bash
        run: |
          set -e
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      # ==========================================
      # 4. RESTORE ENCRYPTED SESSION
      # ==========================================
      - name: استرجاع جلسة واتساب المشفرة
        id: restore-session
        shell: bash
        env:
          ARTHUR_BACKUP_KEY: ${{ secrets.ARTHUR_BACKUP_KEY }}
        run: |
          set -Eeuo pipefail

          BACKUP_BRANCH="arthur-session-backup"
          BACKUP_FILE="session-backup.tar.enc"
          TEMP_DIR="/tmp/arthur-session"
          BACKUP_DIR="/tmp/arthur-backup-repository"

          mkdir -p "$TEMP_DIR"

          if [ -z "${ARTHUR_BACKUP_KEY:-}" ]; then
            echo "ERROR: ARTHUR_BACKUP_KEY is missing."
            exit 1
          fi

          echo "Checking encrypted session backup..."

          if git fetch origin \
            "refs/heads/${BACKUP_BRANCH}:refs/remotes/origin/${BACKUP_BRANCH}" \
            --quiet 2>/dev/null; then

            if git cat-file -e \
              "origin/${BACKUP_BRANCH}:${BACKUP_FILE}" 2>/dev/null; then

              git show \
                "origin/${BACKUP_BRANCH}:${BACKUP_FILE}" \
                > "$TEMP_DIR/$BACKUP_FILE"

              openssl enc -d -aes-256-cbc \
                -pbkdf2 -iter 200000 \
                -in "$TEMP_DIR/$BACKUP_FILE" \
                -out "$TEMP_DIR/session.tar.gz" \
                -pass env:ARTHUR_BACKUP_KEY

              tar -tzf "$TEMP_DIR/session.tar.gz" >/dev/null

              # Encrypted backup takes priority over old cache.
              tar -xzf "$TEMP_DIR/session.tar.gz" \
                -C "$GITHUB_WORKSPACE"

              echo "SESSION_RESTORED=true" >> "$GITHUB_OUTPUT"
              echo "SUCCESS: Encrypted session restored."

            else
              echo "No encrypted archive found."
              echo "Using old cache if available."
              echo "SESSION_RESTORED=false" >> "$GITHUB_OUTPUT"
            fi

            git worktree add --detach "$BACKUP_DIR" \
              "origin/${BACKUP_BRANCH}"

            git -C "$BACKUP_DIR" switch -C "$BACKUP_BRANCH"

          else

            echo "No backup branch exists yet."
            echo "Old cache will be used if available."
            echo "SESSION_RESTORED=false" >> "$GITHUB_OUTPUT"

            git worktree add --detach "$BACKUP_DIR" HEAD

            git -C "$BACKUP_DIR" checkout --orphan \
              "$BACKUP_BRANCH"

            git -C "$BACKUP_DIR" rm -rf . \
              >/dev/null 2>&1 || true

            git -C "$BACKUP_DIR" clean -fdx \
              >/dev/null 2>&1 || true

          fi

          git -C "$BACKUP_DIR" config \
            user.name "github-actions[bot]"

          git -C "$BACKUP_DIR" config \
            user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "BACKUP_DIR=$BACKUP_DIR" >> "$GITHUB_ENV"
          echo "TEMP_DIR=$TEMP_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 5. PROTECT SESSION
      # ==========================================
      - name: حماية ملفات الاتصال من المستودع الرئيسي
        shell: bash
        run: |
          set -Eeuo pipefail

          touch .gitignore

          add_ignore() {
            grep -qxF "$1" .gitignore || echo "$1" >> .gitignore
          }

          add_ignore "node_modules/"
          add_ignore "**/node_modules/"
          add_ignore ".env"
          add_ignore ".env.*"
          add_ignore "!/.env.example"

          add_ignore "ملف_الاتصال/"
          add_ignore "ArthurSession/"
          add_ignore "ArthurSubBot/"
          add_ignore "BackupSession/"
          add_ignore "session/"
          add_ignore "sessions/"
          add_ignore "auth_info_baileys/"

          add_ignore "**/creds.json"
          add_ignore "*.db"
          add_ignore "*.db-*"
          add_ignore "*.pem"
          add_ignore "*.key"
          add_ignore "*.p12"
          add_ignore "*.pfx"
          add_ignore "*.log"
          add_ignore "**/temp/"
          add_ignore "**/*.tmp"

          # Remove tracked session files from main branch index.
          # This does not delete local session files.
          git rm -r --cached --ignore-unmatch -- \
            "ملف_الاتصال" \
            "ArthurSession" \
            "ArthurSubBot" \
            "BackupSession" \
            "session" \
            "sessions" \
            "auth_info_baileys" \
            >/dev/null 2>&1 || true

          echo "Session protection enabled."

      # ==========================================
      # 6. RUN + AUTO SAVE + AUTO UPLOAD
      # ==========================================
      - name: تشغيل البوت والحفظ والرفع التلقائي
        shell: bash
        env:
          ARTHUR_BACKUP_KEY: ${{ secrets.ARTHUR_BACKUP_KEY }}
          NODE_OPTIONS: "--max-old-space-size=4096"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          BACKUP_INTERVAL: "300"
        run: |
          set -Eeuo pipefail

          BACKUP_FILE="session-backup.tar.enc"
          BACKUP_BRANCH="arthur-session-backup"
          MAIN_BRANCH="${GITHUB_REF_NAME:-main}"

          SESSION_DIRS=(
            "ملف_الاتصال"
            "ArthurSession"
            "ArthurSubBot"
            "BackupSession"
            "session"
            "sessions"
            "auth_info_baileys"
          )

          BOT_PID=""
          LAST_SAVE=0

          # ========================================
          # SAVE ENCRYPTED SESSION
          # ========================================
          save_session() {

            echo "Saving WhatsApp session..."

            local existing_dirs=()
            local dir

            for dir in "${SESSION_DIRS[@]}"; do
              if [ -d "$dir" ]; then
                existing_dirs+=("$dir")
              fi
            done

            if [ "${#existing_dirs[@]}" -eq 0 ]; then
              echo "No session folders found."
              echo "Previous backup preserved."
              return 0
            fi

            mkdir -p "$TEMP_DIR"

            tar -czf "$TEMP_DIR/session.tar.gz" \
              -C "$GITHUB_WORKSPACE" \
              "${existing_dirs[@]}"

            tar -tzf "$TEMP_DIR/session.tar.gz" >/dev/null

            openssl enc -aes-256-cbc \
              -salt -pbkdf2 -iter 200000 \
              -in "$TEMP_DIR/session.tar.gz" \
              -out "$TEMP_DIR/$BACKUP_FILE" \
              -pass env:ARTHUR_BACKUP_KEY

            test -s "$TEMP_DIR/$BACKUP_FILE"

            cp "$TEMP_DIR/$BACKUP_FILE" \
              "$BACKUP_DIR/$BACKUP_FILE"

            git -C "$BACKUP_DIR" add -- "$BACKUP_FILE"

            if git -C "$BACKUP_DIR" diff --cached --quiet; then
              echo "Session backup unchanged."
              return 0
            fi

            git -C "$BACKUP_DIR" commit \
              -m "ARTHUR encrypted session backup" --quiet

            git -C "$BACKUP_DIR" push origin \
              "HEAD:refs/heads/${BACKUP_BRANCH}"

            echo "SUCCESS: Session backup uploaded."
          }

          # ========================================
          # SAVE PROJECT CHANGES
          # ========================================
          save_project() {

            echo "Uploading project changes..."

            git add -A

            if ! git diff --cached --quiet; then
              git commit \
                -m "Automatic ARTHUR BOT update" --quiet
            fi

            git fetch origin \
              "+refs/heads/${MAIN_BRANCH}:refs/remotes/origin/${MAIN_BRANCH}" \
              --quiet

            if [ "$(git rev-list --count \
              "origin/${MAIN_BRANCH}..HEAD")" -gt 0 ]; then

              if ! git push origin \
                "HEAD:refs/heads/${MAIN_BRANCH}" --quiet; then

                echo "Push failed. Synchronizing..."

                git fetch origin \
                  "+refs/heads/${MAIN_BRANCH}:refs/remotes/origin/${MAIN_BRANCH}" \
                  --quiet

                if ! git rebase "origin/${MAIN_BRANCH}"; then
                  git rebase --abort 2>/dev/null || true
                  echo "ERROR: Project merge conflict."
                  return 1
                fi

                git push origin \
                  "HEAD:refs/heads/${MAIN_BRANCH}"
              fi

              echo "SUCCESS: Project changes uploaded."

            else
              echo "No new project changes."
            fi
          }

          # ========================================
          # SAFE SHUTDOWN
          # ========================================
          shutdown() {

            echo "Stopping bot..."

            trap - TERM INT

            if [ -n "${BOT_PID:-}" ]; then
              kill -TERM -- "-$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
              BOT_PID=""
            fi

            save_session || echo "WARNING: Final session backup failed."

            save_project || echo "WARNING: Final project upload failed."

            exit 0
          }

          trap shutdown TERM INT

          echo "========================================"
          echo "       ARTHUR BOT PROTECTED RUNNER"
          echo "========================================"

          # Save migrated cache session immediately.
          save_session || {
            echo "ERROR: Initial session backup failed."
            exit 1
          }

          save_project || {
            echo "WARNING: Initial project upload failed."
          }

          LAST_SAVE=$(date +%s)
          RESTART_DELAY=10

          # ========================================
          # BOT RESTART LOOP
          # ========================================
          while true; do

            echo "Starting ARTHUR BOT..."

            setsid npm start &
            BOT_PID=$!

            echo "BOT PID: $BOT_PID"

            while kill -0 "$BOT_PID" 2>/dev/null; do

              sleep 10

              NOW=$(date +%s)

              if [ $((NOW - LAST_SAVE)) -ge "$BACKUP_INTERVAL" ]; then

                if save_session; then
                  LAST_SAVE=$(date +%s)
                else
                  echo "WARNING: Session backup failed."
                fi

                save_project || {
                  echo "WARNING: Project upload failed."
                }

              fi

            done

            if wait "$BOT_PID"; then
              BOT_STATUS=0
            else
              BOT_STATUS=$?
            fi

            BOT_PID=""

            echo "Bot stopped. Exit code: $BOT_STATUS"

            save_session || echo "WARNING: Session backup failed."

            save_project || echo "WARNING: Project upload failed."

            LAST_SAVE=$(date +%s)

            echo "Restarting in ${RESTART_DELAY} seconds..."

            sleep "$RESTART_DELAY"

            RESTART_DELAY=$((RESTART_DELAY + 10))

            if [ "$RESTART_DELAY" -gt 60 ]; then
              RESTART_DELAY=60
            fi

          done
