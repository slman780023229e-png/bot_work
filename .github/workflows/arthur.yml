
name: ARTHUR BOT - Auto Commit & Push

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */4 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: arthur-whatsapp-bot
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 270

    steps:

      # 1. سحب المشروع
      - name: سحب ملفات المشروع
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      # 2. استعادة جلسة واتساب
      - name: استعادة جلسة واتساب
        uses: actions/cache/restore@v4
        with:
          path: |
            ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            arthur-session-${{ github.ref_name }}-
            arthur-session-

      # 3. إعداد Node.js
      - name: تجهيز Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # 4. تثبيت المكتبات
      - name: تثبيت المكتبات
        shell: bash
        run: |
          set -e

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "✅ تم تثبيت المكتبات"

      # 5. حماية الملفات المستثناة
      - name: حماية الجلسة والمكتبات
        shell: bash
        run: |
          set -e

          touch .gitignore

          add_ignore() {
            grep -qxF "$1" .gitignore || echo "$1" >> .gitignore
          }

          add_ignore "node_modules/"
          add_ignore "**/node_modules/"
          add_ignore "ملف_الاتصال/"
          add_ignore "ArthurSession/"
          add_ignore "ArthurSubBot/"
          add_ignore "BackupSession/"
          add_ignore "session/"
          add_ignore "sessions/"
          add_ignore "auth_info_baileys/"
          add_ignore ".env"
          add_ignore ".env.*"
          add_ignore "!/.env.example"
          add_ignore "**/creds.json"
          add_ignore "*.db"
          add_ignore "*.db.*"
          add_ignore "*.pem"
          add_ignore "*.key"
          add_ignore "*.p12"
          add_ignore "*.pfx"
          add_ignore "*.log"
          add_ignore "**/temp/"
          add_ignore "**/*.tmp"

          # إزالة الملفات الخاصة من فهرس Git دون حذفها محلياً
          git rm -r --cached --ignore-unmatch -- \
            "ملف_الاتصال" \
            "node_modules" \
            "ArthurSession" \
            "ArthurSubBot" \
            "BackupSession" \
            "session" \
            "sessions" \
            "auth_info_baileys" || true

          echo "✅ تمت حماية الملفات"

      # 6. تشغيل البوت والرفع التلقائي
      - name: تشغيل البوت ورفع تعديلات المشروع
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
          MONGO_URI: ${{ secrets.MONGO_URI }}
          ARTHUR_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

        run: |
          set +e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # =====================================
          # دالة الحفظ والرفع
          # =====================================
          save_changes() {

            echo "🔍 فحص ملفات المشروع..."

            # إضافة جميع الملفات الجديدة والمعدلة والمحذوفة
            git add -A -- . || {
              echo "❌ فشل جمع الملفات"
              return 1
            }

            if git diff --cached --quiet; then
              echo "ℹ️ لا توجد تعديلات جديدة"
            else

              echo "📦 الملفات التي سيتم حفظها:"
              git diff --cached --name-status

              git commit -m "Auto-save ARTHUR BOT" || {
                echo "❌ فشل إنشاء Commit"
                return 1
              }

              echo "✅ تم إنشاء Commit"
            fi

            # جلب أحدث نسخة من المستودع
            git fetch origin \
              "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || {
                echo "❌ فشل جلب تحديثات GitHub"
                return 1
              }

            AHEAD=$(git rev-list --count \
              "origin/${GITHUB_REF_NAME}..HEAD") || return 1

            if [ "$AHEAD" -eq 0 ]; then
              echo "✅ لا توجد تعديلات معلقة للرفع"
              return 0
            fi

            echo "📤 جاري رفع $AHEAD Commit..."

            # المحاولة الأولى
            if ! git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"; then

              echo "⚠️ فشل الرفع الأول، جاري المزامنة..."

              git fetch origin \
                "+refs/heads/${GITHUB_REF_NAME}:refs/remotes/origin/${GITHUB_REF_NAME}" || return 1

              git -c rebase.autoStash=true rebase \
                "origin/${GITHUB_REF_NAME}" || {
                  git rebase --abort || true
                  echo "❌ حدث تعارض أثناء المزامنة"
                  return 1
                }

              # المحاولة الثانية
              git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}" || {
                echo "❌ فشل الرفع بعد إعادة المحاولة"
                return 1
              }
            fi

            echo "=================================="
            echo "✅ تم رفع التعديلات إلى GitHub"
            echo "=================================="

            return 0
          }

          # =====================================
          # الإيقاف والحفظ النهائي
          # =====================================
          cleanup_and_exit() {

            echo "🛑 جاري إيقاف البوت..."

            if [ -n "${BOT_PID:-}" ]; then
              kill -TERM "$BOT_PID" 2>/dev/null || true
              wait "$BOT_PID" 2>/dev/null || true
              BOT_PID=""
            fi

            save_changes || echo "❌ فشل الحفظ النهائي"

            exit "${1:-0}"
          }

          trap 'cleanup_and_exit 0' SIGTERM SIGINT

          echo "=================================="
          echo "       ARTHUR BOT RUNNER"
          echo "       NODE.JS 24"
          echo "=================================="

          # حفظ التعديلات قبل تشغيل البوت
          save_changes || echo "⚠️ ستتم إعادة محاولة الحفظ"

          RESTART_DELAY=5

          while true; do

            echo "🚀 جاري تشغيل ARTHUR BOT..."

            node start.js &
            BOT_PID=$!

            echo "✅ بدأ البوت PID: $BOT_PID"

            LAST_SAVE=$(date +%s)

            while kill -0 "$BOT_PID" 2>/dev/null; do

              sleep 5

              NOW=$(date +%s)

              if [ $((NOW - LAST_SAVE)) -ge 300 ]; then

                echo "⏳ حان وقت الحفظ الدوري..."

                save_changes || \
                  echo "❌ فشل الرفع الدوري، ستتم المحاولة لاحقاً"

                LAST_SAVE=$(date +%s)
              fi

            done

            wait "$BOT_PID"
            BOT_STATUS=$?
            BOT_PID=""

            echo "⚠️ توقف البوت برمز: $BOT_STATUS"

            save_changes || \
              echo "❌ فشل حفظ التعديلات بعد التوقف"

            echo "🔄 إعادة تشغيل البوت بعد ${RESTART_DELAY} ثوانٍ..."

            sleep "$RESTART_DELAY"

            RESTART_DELAY=$((RESTART_DELAY + 2))

            if [ "$RESTART_DELAY" -gt 30 ]; then
              RESTART_DELAY=30
            fi

          done

      # 7. حفظ جلسة واتساب في Cache
      - name: حفظ جلسة واتساب
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ملف_الاتصال/
          key: arthur-session-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
